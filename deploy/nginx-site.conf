# /etc/nginx/sites-available/mini_qianwen
# 部署位置：scp 到服务器后软链到 /etc/nginx/sites-enabled/，然后 nginx -t && systemctl reload nginx
# 注意：本机 80 端口已被既有 Vue+Java 项目占用，本项目使用 8080 独立端口
server {
    listen 8080;
    server_name _;

    root /var/www/mini_qianwen;
    index index.html;

    # 前端静态页面（frontend/ 目录内容复制到 /var/www/mini_qianwen）
    location / {
        try_files $uri $uri/ =404;
    }

    # API 反向代理：转发到后端容器（compose 映射在 127.0.0.1:8000）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # SSE 流式输出必需：关闭缓冲与缓存，拉长读超时（需大于后端模型 90s 超时）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
