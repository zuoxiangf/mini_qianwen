services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bp_local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy:/docker-entrypoint-initdb.d:ro   # 放 4.2 节的建表 SQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage    # 数据持久化，容器重建不丢知识库

  backend:
    build: ./backend
    env_file: .env.prod                # 服务器上手工创建，不进 git
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"          # 只绑本机回环，由 Nginx 对外反代
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data: