# mini_qianwen 生产部署编排（Nginx 用宿主机已有的，不在此编排内）
# 用法：cp .env.prod.example .env.prod 并填好值后 → docker compose --env-file .env.prod up -d --build
services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bp_local}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # 仅首次启动自动执行
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage      # 知识库向量数据持久化，容器重建不丢
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env.prod
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"            # 只绑回环：公网流量必须经宿主机 Nginx(8080) 反代进来
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
